name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract Android project
        run: |
          rm -rf extracted-project
          mkdir extracted-project
          unzip -q CapturaCubagemAndroid-projeto.zip -d extracted-project

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          SETTINGS=$(find extracted-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found inside project ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Apply professional interface
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"
          MAIN=$(find "$PROJECT_DIR/app/src/main/java" -type f -name MainActivity.java | head -n 1)
          if [ -z "$MAIN" ]; then
            echo "MainActivity.java not found"
            exit 1
          fi

          python3 - "$MAIN" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          old = path.read_text(encoding='utf-8')
          m = re.search(r'^package\s+([\w.]+);', old, re.M)
          if not m:
              raise SystemExit('Package not found in MainActivity.java')
          pkg = m.group(1)
          src = r'''package __PACKAGE__;

import android.app.Activity;
import android.content.Intent;
import android.graphics.Bitmap;
import android.graphics.Color;
import android.graphics.Typeface;
import android.graphics.drawable.GradientDrawable;
import android.os.Bundle;
import android.provider.MediaStore;
import android.text.Editable;
import android.text.TextWatcher;
import android.view.Gravity;
import android.view.View;
import android.widget.Button;
import android.widget.EditText;
import android.widget.ImageView;
import android.widget.LinearLayout;
import android.widget.ScrollView;
import android.widget.TextView;
import android.widget.Toast;

public class MainActivity extends Activity {
    private static final int REQ_ITEM_CAMERA = 100;
    private static final int REQ_ITEM_GALLERY = 101;
    private static final int REQ_CARD_CAMERA = 102;
    private static final int REQ_CARD_GALLERY = 103;
    private static final double CONTAINER_CAPACITY = 68.0;

    private EditText name, length, width, height, weight, quantity;
    private TextView unitVolume, totalVolume, containerStatus;
    private ImageView itemPreview, cardPreview;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setTitle("Cubagem 68 Pro");
        setContentView(buildScreen());
    }

    private View buildScreen() {
        ScrollView scroll = new ScrollView(this);
        scroll.setFillViewport(true);
        scroll.setBackgroundColor(Color.rgb(246, 248, 251));

        LinearLayout root = column();
        root.setPadding(dp(18), dp(22), dp(18), dp(30));
        scroll.addView(root);

        TextView title = text("Cubagem 68 Pro", 28, true, Color.rgb(20, 32, 51));
        root.addView(title);
        TextView subtitle = text("Cadastro rápido de produtos e ocupação do container", 15, false, Color.rgb(105, 116, 130));
        subtitle.setPadding(0, dp(4), 0, dp(18));
        root.addView(subtitle);

        LinearLayout progressCard = card();
        progressCard.addView(text("CONTAINER", 12, true, Color.rgb(102, 112, 128)));
        containerStatus = text("0,000 m³ de 68,000 m³", 22, true, Color.rgb(17, 24, 39));
        containerStatus.setPadding(0, dp(6), 0, 0);
        progressCard.addView(containerStatus);
        root.addView(progressCard);
        spacer(root, 14);

        LinearLayout productCard = card();
        productCard.addView(section("Produto"));
        name = field("Nome do produto");
        productCard.addView(name);
        spacer(productCard, 10);
        productCard.addView(text("Foto do produto", 14, true, Color.rgb(45, 55, 72)));
        spacer(productCard, 8);
        LinearLayout photoButtons = row();
        photoButtons.addView(actionButton("Tirar foto", true, v -> launchCamera(REQ_ITEM_CAMERA)), weightParams());
        spacerHorizontal(photoButtons, 8);
        photoButtons.addView(actionButton("Galeria", false, v -> launchGallery(REQ_ITEM_GALLERY)), weightParams());
        productCard.addView(photoButtons);
        itemPreview = preview();
        productCard.addView(itemPreview);
        root.addView(productCard);
        spacer(root, 14);

        LinearLayout measureCard = card();
        measureCard.addView(section("Medidas da embalagem"));
        TextView hint = text("Informe em centímetros. A cubagem é calculada automaticamente.", 13, false, Color.rgb(107, 114, 128));
        hint.setPadding(0, 0, 0, dp(10));
        measureCard.addView(hint);

        LinearLayout r1 = row();
        length = numberField("Comprimento");
        width = numberField("Largura");
        r1.addView(length, weightParams());
        spacerHorizontal(r1, 8);
        r1.addView(width, weightParams());
        measureCard.addView(r1);
        spacer(measureCard, 8);

        LinearLayout r2 = row();
        height = numberField("Altura");
        weight = numberField("Peso kg");
        r2.addView(height, weightParams());
        spacerHorizontal(r2, 8);
        r2.addView(weight, weightParams());
        measureCard.addView(r2);
        spacer(measureCard, 8);

        quantity = numberField("Quantidade");
        quantity.setText("1");
        measureCard.addView(quantity);
        spacer(measureCard, 14);

        LinearLayout volumeBox = column();
        volumeBox.setPadding(dp(14), dp(12), dp(14), dp(12));
        volumeBox.setBackground(roundRect(Color.rgb(239, 246, 255), 14, 0, 0));
        unitVolume = text("Cubagem unitária: 0,000000 m³", 16, true, Color.rgb(30, 64, 175));
        totalVolume = text("Cubagem total: 0,000000 m³", 18, true, Color.rgb(30, 64, 175));
        totalVolume.setPadding(0, dp(6), 0, 0);
        volumeBox.addView(unitVolume);
        volumeBox.addView(totalVolume);
        measureCard.addView(volumeBox);
        root.addView(measureCard);
        spacer(root, 14);

        LinearLayout cardCard = card();
        cardCard.addView(section("Cartão de visita"));
        TextView cardHint = text("Fotografe ou selecione o cartão do fornecedor para manter junto ao cadastro.", 13, false, Color.rgb(107, 114, 128));
        cardHint.setPadding(0, 0, 0, dp(10));
        cardCard.addView(cardHint);
        LinearLayout cardButtons = row();
        cardButtons.addView(actionButton("Fotografar cartão", true, v -> launchCamera(REQ_CARD_CAMERA)), weightParams());
        spacerHorizontal(cardButtons, 8);
        cardButtons.addView(actionButton("Selecionar", false, v -> launchGallery(REQ_CARD_GALLERY)), weightParams());
        cardCard.addView(cardButtons);
        cardPreview = preview();
        cardCard.addView(cardPreview);
        root.addView(cardCard);
        spacer(root, 18);

        Button save = actionButton("Salvar item", true, v -> saveItem());
        save.setTextSize(18);
        save.setMinHeight(dp(56));
        root.addView(save);

        TextWatcher watcher = new TextWatcher() {
            public void beforeTextChanged(CharSequence s, int st, int c, int a) {}
            public void onTextChanged(CharSequence s, int st, int b, int c) { recalc(); }
            public void afterTextChanged(Editable e) {}
        };
        length.addTextChangedListener(watcher);
        width.addTextChangedListener(watcher);
        height.addTextChangedListener(watcher);
        quantity.addTextChangedListener(watcher);

        return scroll;
    }

    private void recalc() {
        double l = val(length), w = val(width), h = val(height);
        double q = Math.max(1, val(quantity));
        double unit = (l * w * h) / 1000000.0;
        double total = unit * q;
        unitVolume.setText(String.format(java.util.Locale.US, "Cubagem unitária: %.6f m³", unit).replace('.', ','));
        totalVolume.setText(String.format(java.util.Locale.US, "Cubagem total: %.6f m³", total).replace('.', ','));
        double pct = Math.min(100.0, (total / CONTAINER_CAPACITY) * 100.0);
        containerStatus.setText(String.format(java.util.Locale.US, "%.3f m³ de 68,000 m³  •  %.1f%%", total, pct).replace('.', ','));
    }

    private double val(EditText e) {
        try { return Double.parseDouble(e.getText().toString().trim().replace(',', '.')); }
        catch (Exception ex) { return 0; }
    }

    private void saveItem() {
        if (name.getText().toString().trim().isEmpty()) {
            Toast.makeText(this, "Informe o nome do produto", Toast.LENGTH_SHORT).show();
            name.requestFocus();
            return;
        }
        Toast.makeText(this, "Item salvo no catálogo", Toast.LENGTH_LONG).show();
    }

    private void launchCamera(int requestCode) {
        Intent i = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
        if (i.resolveActivity(getPackageManager()) != null) startActivityForResult(i, requestCode);
        else Toast.makeText(this, "Câmera não disponível", Toast.LENGTH_SHORT).show();
    }

    private void launchGallery(int requestCode) {
        Intent i = new Intent(Intent.ACTION_GET_CONTENT);
        i.setType("image/*");
        startActivityForResult(Intent.createChooser(i, "Selecionar imagem"), requestCode);
    }

    @Override
    protected void onActivityResult(int requestCode, int resultCode, Intent data) {
        super.onActivityResult(requestCode, resultCode, data);
        if (resultCode != RESULT_OK || data == null) return;
        ImageView target = (requestCode == REQ_CARD_CAMERA || requestCode == REQ_CARD_GALLERY) ? cardPreview : itemPreview;
        try {
            if (requestCode == REQ_ITEM_CAMERA || requestCode == REQ_CARD_CAMERA) {
                Bitmap bmp = (Bitmap) data.getExtras().get("data");
                target.setImageBitmap(bmp);
            } else if (data.getData() != null) {
                target.setImageURI(data.getData());
            }
            target.setVisibility(View.VISIBLE);
        } catch (Exception e) {
            Toast.makeText(this, "Não foi possível abrir a imagem", Toast.LENGTH_SHORT).show();
        }
    }

    private LinearLayout column() {
        LinearLayout l = new LinearLayout(this); l.setOrientation(LinearLayout.VERTICAL); return l;
    }
    private LinearLayout row() {
        LinearLayout l = new LinearLayout(this); l.setOrientation(LinearLayout.HORIZONTAL); return l;
    }
    private LinearLayout card() {
        LinearLayout l = column();
        l.setPadding(dp(16), dp(16), dp(16), dp(16));
        l.setBackground(roundRect(Color.WHITE, 18, Color.rgb(229, 233, 239), 1));
        return l;
    }
    private TextView section(String s) {
        TextView t = text(s, 19, true, Color.rgb(31, 41, 55));
        t.setPadding(0, 0, 0, dp(12)); return t;
    }
    private EditText field(String hint) {
        EditText e = new EditText(this);
        e.setHint(hint); e.setTextSize(16); e.setSingleLine(true);
        e.setPadding(dp(14), 0, dp(14), 0); e.setMinHeight(dp(52));
        e.setBackground(roundRect(Color.rgb(249, 250, 251), 13, Color.rgb(218, 223, 230), 1));
        return e;
    }
    private EditText numberField(String hint) {
        EditText e = field(hint);
        e.setInputType(android.text.InputType.TYPE_CLASS_NUMBER | android.text.InputType.TYPE_NUMBER_FLAG_DECIMAL);
        return e;
    }
    private Button actionButton(String label, boolean primary, View.OnClickListener listener) {
        Button b = new Button(this);
        b.setText(label); b.setAllCaps(false); b.setTextSize(15); b.setTypeface(Typeface.DEFAULT_BOLD);
        b.setTextColor(primary ? Color.WHITE : Color.rgb(36, 46, 61));
        b.setBackground(roundRect(primary ? Color.rgb(35, 99, 235) : Color.WHITE, 14, Color.rgb(210, 216, 224), 1));
        b.setOnClickListener(listener); b.setMinHeight(dp(50)); return b;
    }
    private TextView text(String s, int sp, boolean bold, int color) {
        TextView t = new TextView(this); t.setText(s); t.setTextSize(sp); t.setTextColor(color);
        if (bold) t.setTypeface(Typeface.DEFAULT_BOLD); return t;
    }
    private ImageView preview() {
        ImageView iv = new ImageView(this);
        iv.setAdjustViewBounds(true); iv.setScaleType(ImageView.ScaleType.CENTER_CROP);
        iv.setVisibility(View.GONE);
        LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(180));
        p.topMargin = dp(10); iv.setLayoutParams(p);
        iv.setBackground(roundRect(Color.rgb(243, 244, 246), 14, 0, 0));
        return iv;
    }
    private GradientDrawable roundRect(int fill, int radiusDp, int stroke, int strokeDp) {
        GradientDrawable g = new GradientDrawable(); g.setColor(fill); g.setCornerRadius(dp(radiusDp));
        if (strokeDp > 0) g.setStroke(dp(strokeDp), stroke); return g;
    }
    private LinearLayout.LayoutParams weightParams() {
        return new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
    }
    private void spacer(LinearLayout l, int dp) {
        View v = new View(this); l.addView(v, new LinearLayout.LayoutParams(1, dp(dp)));
    }
    private void spacerHorizontal(LinearLayout l, int dp) {
        View v = new View(this); l.addView(v, new LinearLayout.LayoutParams(dp(dp), 1));
    }
    private int dp(int v) { return Math.round(v * getResources().getDisplayMetrics().density); }
}
'''.replace('__PACKAGE__', pkg)
          path.write_text(src, encoding='utf-8')
          print('Professional MainActivity written to', path)
          PY

      - name: Fix Android SDK level
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"
          find "$PROJECT_DIR" -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print0 | while IFS= read -r -d '' FILE; do
            sed -i -E 's/(compileSdkVersion[[:space:]]+)[0-9]+/\135/g' "$FILE"
            sed -i -E 's/(compileSdk[[:space:]]*=[[:space:]]*)[0-9]+/\135/g' "$FILE"
            sed -i -E 's/(compileSdk[[:space:]]+)[0-9]+/\135/g' "$FILE"
          done

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle assembleDebug --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.locate.outputs.project_dir }}" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found after build"
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Captura-Cubagem-Pro-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
