# Workflow de compilação do APK
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          rm -rf extracted-project
          mkdir -p extracted-project
          unzip -q CapturaCubagemAndroid-projeto.zip -d extracted-project

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          set -e
          SETTINGS=$(find extracted-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found inside project ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project: $PROJECT_DIR"

      - name: Fix Android SDK level
        shell: bash
        run: |
          set -e
          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"
          find "$PROJECT_DIR" -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print0 | while IFS= read -r -d '' FILE; do
            sed -i -E 's/(compileSdkVersion[[:space:]]+)[0-9]+/\135/g' "$FILE"
            sed -i -E 's/(compileSdk[[:space:]]*=[[:space:]]*)[0-9]+/\135/g' "$FILE"
            sed -i -E 's/(compileSdk[[:space:]]+)[0-9]+/\135/g' "$FILE"
          done

      - name: Repair AndroidManifest XML
        shell: bash
        run: |
          set -e
          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          mkdir -p "$(dirname "$MANIFEST")"
          cat > "$MANIFEST" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="Captura & Cubagem"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name="com.didoflores.capturacubagem.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          echo "Manifest reparado: $MANIFEST"
          cat "$MANIFEST"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle assembleDebug --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -e
          APK=$(find "${{ steps.locate.outputs.project_dir }}" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found after build"
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cubagem68Pro-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
