name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract Android project
        run: |
          rm -rf extracted-project
          mkdir extracted-project
          unzip -q CapturaCubagemAndroid-projeto.zip -d extracted-project
          echo "Project contents:"
          find extracted-project -maxdepth 3 -type f | sort

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          SETTINGS=$(find extracted-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found inside project ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using Gradle project at $PROJECT_DIR"

      - name: Fix MainActivity TextView helper
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"
          MAIN=$(find "$PROJECT_DIR/app/src/main/java" -type f -name MainActivity.java | head -n 1)
          if [ -z "$MAIN" ]; then
            echo "MainActivity.java not found"
            exit 1
          fi
          python3 - "$MAIN" <<'PY'
          import pathlib, sys

          path = pathlib.Path(sys.argv[1])
          src = path.read_text(encoding="utf-8")

          # Ensure TextView is imported before using the helper.
          textview_import = "import android.widget.TextView;"
          if textview_import not in src:
              lines = src.splitlines()
              insert_at = 0
              for i, line in enumerate(lines):
                  if line.startswith("import "):
                      insert_at = i + 1
              lines.insert(insert_at, textview_import)
              src = "\n".join(lines) + ("\n" if src.endswith("\n") else "")
              print("Added TextView import to", path)

          signature = "TextView tv(String text, int sizeSp, boolean bold)"
          if signature not in src:
              method = r'''

              private TextView tv(String text, int sizeSp, boolean bold) {
                  TextView view = new TextView(this);
                  view.setText(text);
                  view.setTextSize(sizeSp);
                  view.setPadding(8, 8, 8, 8);
                  if (bold) {
                      view.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);
                  }
                  return view;
              }
          '''
              pos = src.rfind("}")
              if pos < 0:
                  raise SystemExit("Could not find class closing brace in MainActivity.java")
              src = src[:pos] + method + src[pos:]
              print("Added tv(String, int, boolean) overload to", path)
          else:
              print("TextView helper already present")

          path.write_text(src, encoding="utf-8")
          PY

      - name: Fix Android SDK level
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"
          echo "Patching compileSdk to 35 if needed..."
          find "$PROJECT_DIR" -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print0 | while IFS= read -r -d '' FILE; do
            sed -i -E 's/(compileSdkVersion[[:space:]]+)[0-9]+/\135/g' "$FILE"
            sed -i -E 's/(compileSdk[[:space:]]*=[[:space:]]*)[0-9]+/\135/g' "$FILE"
            sed -i -E 's/(compileSdk[[:space:]]+)[0-9]+/\135/g' "$FILE"
          done
          grep -RInE 'compileSdk|compileSdkVersion' "$PROJECT_DIR" --include='build.gradle' --include='build.gradle.kts' || true

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle assembleDebug --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.locate.outputs.project_dir }}" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found after build"
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK generated: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Captura-Cubagem-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
