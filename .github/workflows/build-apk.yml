name: Build Android APK

on:
  push:
    branches:
      - main
      - fix/android-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          rm -rf extracted-project
          mkdir extracted-project
          unzip -q CapturaCubagemAndroid-projeto.zip -d extracted-project
          echo "Project contents:"
          find extracted-project -maxdepth 3 -type f | sort

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          GRADLEW=$(find extracted-project -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found inside project ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          chmod +x "$GRADLEW"
          echo "Using Gradle project at $PROJECT_DIR"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.locate.outputs.project_dir }}" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found after build"
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK generated: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Captura-Cubagem-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
